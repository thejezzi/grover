[workspace]
members = ["grover-lib", "grover-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
grover-lib = { path = "grover-lib" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
inquire = { version = "0.9", default-features = false, features = ["crossterm", "fuzzy"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
strsim = "0.11"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
